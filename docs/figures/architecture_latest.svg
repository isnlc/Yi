<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1080" viewBox="0 0 2400 1080"><defs><marker id="arrow-red" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 16 8 L 0 16 z" fill="#9B382B"/></marker><marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 16 8 L 0 16 z" fill="#356B85"/></marker><marker id="arrow-gold" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 16 8 L 0 16 z" fill="#987441"/></marker></defs><rect x="0" y="0" width="2400" height="1080" rx="0" fill="#F7F3E9" stroke="#F7F3E9" stroke-width="0"/><text x="70" y="60" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#9B382B" text-anchor="start">交互接入</text><text x="70" y="91" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#6F675E" text-anchor="start">输入与来源边界</text><line x1="220" y1="72" x2="2320" y2="72" stroke="#D6CAB9" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="260" y="30" width="470" height="94" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><rect x="260" y="30" width="7" height="94" rx="2" fill="#9B382B" stroke="#9B382B" stroke-width="0"/><text x="290" y="69" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#9B382B" text-anchor="start">多模态组合输入</text><text x="290" y="102" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#6F675E" text-anchor="start">文字、语音、图片、多个文件</text><rect x="870" y="30" width="470" height="94" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><rect x="870" y="30" width="7" height="94" rx="2" fill="#9B382B" stroke="#9B382B" stroke-width="0"/><text x="900" y="69" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#9B382B" text-anchor="start">解析与来源隔离</text><text x="900" y="102" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#6F675E" text-anchor="start">正文、OCR、元数据、附件边界</text><rect x="1480" y="30" width="470" height="94" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><rect x="1480" y="30" width="7" height="94" rx="2" fill="#9B382B" stroke="#9B382B" stroke-width="0"/><text x="1510" y="69" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#9B382B" text-anchor="start">统一请求对象</text><text x="1510" y="102" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#6F675E" text-anchor="start">内容、附件与来源标签</text><line x1="730" y1="77" x2="870" y2="77" stroke="#9B382B" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-red)"/><line x1="1340" y1="77" x2="1480" y2="77" stroke="#9B382B" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-red)"/><line x1="1715" y1="124" x2="1715" y2="164" stroke="#9B382B" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-red)"/><text x="70" y="198" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#9B382B" text-anchor="start">统一编排</text><text x="70" y="229" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#6F675E" text-anchor="start">任务识别与读写边界</text><line x1="220" y1="210" x2="2320" y2="210" stroke="#D6CAB9" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="500" y="164" width="1400" height="142" rx="3" fill="#FFFEFA" stroke="#9B382B" stroke-width="3"/><text x="540" y="207" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#9B382B" text-anchor="start">统一编排器</text><text x="540" y="246" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#28241F" text-anchor="start">识别任务类型，执行记忆准入，选择仅检索 / 检索后推理 / 通用问答</text><text x="540" y="277" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#6F675E" text-anchor="start">规则和结构化状态控制正式写入、版本关系与证据范围</text><rect x="1950" y="164" width="350" height="142" rx="3" fill="#F7F3E9" stroke="#356B85" stroke-width="2" stroke-dasharray="9 8"/><text x="2125" y="207" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#356B85" text-anchor="middle">可选模型服务</text><text x="2125" y="242" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#6F675E" text-anchor="middle"><tspan x="2125" dy="0">语义分类、歧义补全、建议推理与表达</tspan><tspan x="2125" dy="28">不直接写记忆，不改变证据范围</tspan></text><line x1="1950" y1="235" x2="1900" y2="235" stroke="#356B85" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="7 7"/><path d="M 925 306 L 925 350 L 560 350 L 560 388" stroke="#9B382B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-red)"/><path d="M 1475 306 L 1475 350 L 1780 350 L 1780 388" stroke="#356B85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-blue)"/><text x="70" y="416" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#9B382B" text-anchor="start">任务执行</text><text x="70" y="447" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#6F675E" text-anchor="start">四项智能体任务</text><line x1="220" y1="428" x2="2320" y2="428" stroke="#D6CAB9" stroke-width="2" stroke-linecap="round" fill="none"/><text x="310" y="374" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#9B382B" text-anchor="start">记忆写入与治理</text><text x="1530" y="374" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#356B85" text-anchor="start">检索与作答</text><rect x="260" y="388" width="600" height="100" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><rect x="260" y="388" width="7" height="100" rx="2" fill="#9B382B" stroke="#9B382B" stroke-width="0"/><text x="290" y="427" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#9B382B" text-anchor="start">Recorder：记录抽取</text><text x="290" y="460" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#6F675E" text-anchor="start">准入结果结构化为主题、对象、属性、值、时间和来源</text><line x1="560" y1="488" x2="560" y2="522" stroke="#9B382B" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-red)"/><rect x="260" y="522" width="600" height="100" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><rect x="260" y="522" width="7" height="100" rx="2" fill="#9B382B" stroke="#9B382B" stroke-width="0"/><text x="290" y="561" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#9B382B" text-anchor="start">Reconciler：冲突治理</text><text x="290" y="594" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#6F675E" text-anchor="start">依据对象、事实日期与全局写入序裁决，保留旧版本和取代关系</text><rect x="1480" y="388" width="600" height="100" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><rect x="1480" y="388" width="7" height="100" rx="2" fill="#356B85" stroke="#356B85" stroke-width="0"/><text x="1510" y="427" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#356B85" text-anchor="start">Retriever：证据检索</text><text x="1510" y="460" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#6F675E" text-anchor="start">BM25、时间窗和主题图三路召回，使用 RRF 融合</text><line x1="1780" y1="488" x2="1780" y2="522" stroke="#356B85" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-blue)"/><rect x="1480" y="522" width="600" height="100" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><rect x="1480" y="522" width="7" height="100" rx="2" fill="#356B85" stroke="#356B85" stroke-width="0"/><text x="1510" y="561" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#356B85" text-anchor="start">范围裁决</text><text x="1510" y="594" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#6F675E" text-anchor="start">按当前、历史、演变或画像确定可用证据</text><line x1="1780" y1="622" x2="1780" y2="656" stroke="#356B85" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-blue)"/><rect x="1480" y="656" width="600" height="100" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><rect x="1480" y="656" width="7" height="100" rx="2" fill="#356B85" stroke="#356B85" stroke-width="0"/><text x="1510" y="695" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#356B85" text-anchor="start">Auditor：回答审核</text><text x="1510" y="728" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#6F675E" text-anchor="start">检查证据充分性、版本时效和拒答边界</text><line x1="1780" y1="756" x2="1780" y2="786" stroke="#356B85" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-blue)"/><rect x="1480" y="786" width="600" height="52" rx="3" fill="#EAF1F4" stroke="#356B85" stroke-width="3"/><text x="1780" y="822" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#356B85" text-anchor="middle">回答 + 证据</text><text x="70" y="680" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#9B382B" text-anchor="start">状态与证据</text><text x="70" y="711" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#6F675E" text-anchor="start">共享记忆状态</text><line x1="220" y1="692" x2="1320" y2="692" stroke="#D6CAB9" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="560" y1="622" x2="560" y2="656" stroke="#9B382B" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-red)"/><rect x="260" y="656" width="920" height="182" rx="3" fill="#FFFEFA" stroke="#9B382B" stroke-width="3"/><text x="292" y="699" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#9B382B" text-anchor="start">分层记忆与资料状态</text><text x="1148" y="698" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#6F675E" text-anchor="end">正式状态由规则维护</text><line x1="292" y1="720" x2="1148" y2="720" stroke="#D6CAB9" stroke-width="2" stroke-linecap="round" fill="none"/><text x="310" y="760" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#28241F" text-anchor="start">当前</text><text x="475" y="760" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#28241F" text-anchor="start">归档</text><text x="640" y="760" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#28241F" text-anchor="start">淡化</text><text x="805" y="760" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#28241F" text-anchor="start">长期结论</text><text x="1015" y="760" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#356B85" text-anchor="start">附件资料</text><line x1="292" y1="781" x2="1148" y2="781" stroke="#D6CAB9" stroke-width="2" stroke-linecap="round" fill="none"/><text x="310" y="814" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#9B382B" text-anchor="start">取代链</text><text x="475" y="814" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#356B85" text-anchor="start">来源证据</text><text x="690" y="814" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#987441" text-anchor="start">可恢复状态</text><path d="M 1180 748 L 1335 748 L 1335 438 L 1480 438" stroke="#356B85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-blue)"/><rect x="1200" y="560" width="270" height="64" rx="3" fill="#F7F3E9" stroke="#F7F3E9" stroke-width="0"/><text x="1335" y="585" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#356B85" text-anchor="middle"><tspan x="1335" dy="0">按问题读取</tspan><tspan x="1335" dy="22">受版本约束的证据</tspan></text><text x="70" y="902" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#987441" text-anchor="start">验证与回归</text><text x="245" y="901" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#6F675E" text-anchor="start">运行日志和实验结果约束规则，不直接改写记忆结论</text><line x1="70" y1="922" x2="2320" y2="922" stroke="#D6CAB9" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="120" y="948" width="510" height="86" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><text x="150" y="984" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#987441" text-anchor="start">统一事件日志</text><text x="150" y="1013" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#6F675E" text-anchor="start">准入、冲突、检索、审核</text><line x1="630" y1="991" x2="710" y2="991" stroke="#987441" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-gold)"/><rect x="710" y="948" width="720" height="86" rx="3" fill="#FFFEFA" stroke="#D6CAB9" stroke-width="2"/><text x="740" y="984" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#987441" text-anchor="start">固定题集、消融实验、自动回归</text><text x="740" y="1013" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#6F675E" text-anchor="start">统一数据与时间基准，验证各机制贡献</text><line x1="1430" y1="991" x2="1510" y2="991" stroke="#987441" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow-gold)"/><rect x="1510" y="948" width="790" height="86" rx="3" fill="#F4EFE3" stroke="#987441" stroke-width="2"/><text x="1540" y="984" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#987441" text-anchor="start">失败样本回灌</text><text x="1540" y="1013" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#28241F" text-anchor="start">进入规则、题集和回归测试，保持结果可复现</text></svg>